[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-market-surveillance"
version = "0.1.0"
description = "SQL-driven equity market surveillance for NSE/BSE data (yfinance) with a Streamlit dashboard"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["yfinance>=0.2.50", "pandas>=2.0", "numpy>=1.24", "streamlit>=1.35", "plotly>=5.20"]

[project.scripts]
surveillance = "surveillance.cli:main"

[tool.setuptools]
packages = ["surveillance"]
[tool.setuptools.package-data]
surveillance = ["sql/*.sql"]
